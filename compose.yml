# notebook mhdn no Docker. A produção vai pra Vercel, com o progresso no
# Supabase (#13); este compose fica pro preview e pra quem quiser rodar na
# máquina, com o PGlite no volume.
#
# Stack separada da Conta mhdn (central-contas): reiniciar o notebook não
# derruba o login, e o contrário também vale.

name: notebook

services:
  notebook:
    build: .
    restart: unless-stopped
    environment:
      EMISSOR: ${EMISSOR:-https://conta.mhdn.com.br/application/o/notebook/}
      CONTA: ${CONTA:-https://conta.mhdn.com.br}
      CLIENT_ID: notebook
      BASE_URL: ${BASE_URL:-https://notebook.mhdn.com.br}
    ports:
      # Só loopback, e nada publica esta porta: a produção é a Vercel.
      - "127.0.0.1:${PORTA_NOTEBOOK:-9400}:3000"
    volumes:
      # O único lugar onde o container escreve: o PGlite com o progresso. O
      # notebook.db do SQLite de antes fica aqui também, intocado: é o backup
      # do progresso até o corte (2026-11-19).
      - dados:/dados
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  dados:
